<!-- ============================================================
     HOW TO CONVERT YOUR EXISTING PAGES
     ============================================================

     STEP 1 — ADD TWO FILES TO YOUR ROOT FOLDER:
       ├── nav.html          ← the nav include
       ├── footer.html       ← the footer include
       ├── js/
       │   ├── includes.js   ← the loader (ADD THIS)
       │   └── main.js       ← your existing script
       ├── css/
       │   └── main.css
       ├── index.html
       ├── about.html
       ├── community.html
       └── pages/
           ├── kilimanjaro.html
           ├── tours.html
           ├── zanzibar.html
           ├── gallery.html
           ├── contact.html
           ├── destinations.html
           ├── kili-routes/
           │   ├── machame-route.html
           │   ├── lemosho-route.html
           │   ├── rongai-route.html
           │   ├── marangu-route.html
           │   └── umbwe-route.html
           └── tour-packages/
               ├── classic-safari.html
               ├── serengeti-ngorongoro-3day.html
               ├── serengeti-flyin-2day.html
               ├── zanzibar-serengeti-flyin.html
               ├── tarangire-ngorongoro-manyara.html
               └── bush-to-beach.html


     STEP 2 — IN EVERY HTML FILE, MAKE THESE CHANGES:
     ─────────────────────────────────────────────────

     REMOVE these elements entirely from every page:
       • <div id="cursor"></div>
       • <div id="cursor-ring"></div>
       • <button id="back-top">...</button>
       • <nav id="nav">...</nav>
       • <nav class="mob-menu" id="mob-menu">...</nav>
       • <footer>...</footer>
       • <a class="wa-btn" ...></a>

     ADD this at the very top of <body> (before everything else):
       <div id="site-nav"></div>

     ADD this at the bottom of <body> (just before the scripts):
       <div id="site-footer"></div>

     CHANGE the two script tags at the bottom to:
       (adjust path prefix based on folder depth — see DEPTH GUIDE below)
       <script src="PATH/js/includes.js"></script>
       <script src="PATH/js/main.js"></script>


     STEP 3 — DEPTH GUIDE FOR SCRIPT PATH PREFIX:
     ─────────────────────────────────────────────

     ROOT level (index.html, about.html, community.html):
       <script src="js/includes.js"></script>
       <script src="js/main.js"></script>

     pages/ level (kilimanjaro.html, tours.html, zanzibar.html, etc.):
       <script src="../js/includes.js"></script>
       <script src="../js/main.js"></script>

     pages/tour-packages/ and pages/kili-routes/ levels:
       <script src="../../js/includes.js"></script>
       <script src="../../js/main.js"></script>


     ============================================================
     EXAMPLE A — about.html (ROOT level, no prefix needed)
     ============================================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>About Us – Sere Safari Africa</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- NAV PLACEHOLDER — includes.js injects nav.html here -->
  <div id="site-nav"></div>

  <!-- ↓↓↓ ALL YOUR PAGE CONTENT STAYS EXACTLY THE SAME ↓↓↓ -->

  <header class="page-header" style="background-image:url('images/14.webp');">
    <div class="breadcrumb"><a href="index.html">Home</a><i class="fa-solid fa-chevron-right"></i>About Us</div>
    <div class="section-tag"><i class="fa-solid fa-circle-info"></i> Who We Are</div>
    <h1 class="section-title" style="font-size:clamp(2.5rem,6vw,4.5rem);">Our <em>Story</em></h1>
    <p class="section-sub" style="max-width:580px;margin:0 auto;">Tanzania's locally owned safari operator — crafting
      unforgettable adventures since day one, guided by passion, integrity and a deep love for Africa.</p>
  </header>

  <!-- ... rest of about.html content ... -->

  <!-- FOOTER PLACEHOLDER — includes.js injects footer.html here -->
  <div id="site-footer"></div>

  <!-- SCRIPTS: includes.js FIRST, then main.js -->
  <script src="js/includes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>


<!-- ============================================================
