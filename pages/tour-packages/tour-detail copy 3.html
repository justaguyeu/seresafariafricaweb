<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Loading… – Seresafari Africa</title>
    <meta name="description" content="" />
    <link rel="stylesheet" href="../../css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      /* ── SKELETON ── */
      .skel {
        background: linear-gradient(
          90deg,
          rgba(87, 69, 53, 0.08) 25%,
          rgba(87, 69, 53, 0.16) 50%,
          rgba(87, 69, 53, 0.08) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 2px;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      .skel-hero {
        height: 70vh;
        min-height: 480px;
      }
      .skel-block {
        height: 16px;
        margin-bottom: 0.7rem;
      }
      .skel-block.w80 {
        width: 80%;
      }
      .skel-block.w60 {
        width: 60%;
      }
      .skel-block.w40 {
        width: 40%;
      }
      .skel-layout {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 3rem;
        padding: 4rem 8%;
        background: var(--dark2);
      }
      @media (max-width: 900px) {
        .skel-layout {
          grid-template-columns: 1fr;
          padding: 3rem 5%;
        }
      }

      /* ── NOT FOUND ── */
      .not-found {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
        padding: 4rem 2rem;
      }
      .not-found i {
        font-size: 3rem;
        color: var(--gold);
        opacity: 0.4;
        margin-bottom: 1.2rem;
      }
      .not-found h2 {
        font-family: var(--ff-head);
        font-size: 2rem;
        color: var(--white);
        letter-spacing: 2px;
        margin-bottom: 0.7rem;
      }
      .not-found p {
        color: var(--text);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }

      /* ══════════════════════════════════════════
       ACCOMMODATION POPUP MODAL — A&K-style layout
    ══════════════════════════════════════════ */
      .accom-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(26, 15, 7, 0.78);
        z-index: 9000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      .accom-modal-overlay.open {
        opacity: 1;
        pointer-events: all;
      }

      /* ── MODAL SHELL ── */
      .accom-modal {
        background: #fff;
        max-width: 980px;
        width: 100%;
        max-height: 90vh;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        animation: accomIn 0.35s ease;
        border-radius: 2px;
      }
      @keyframes accomIn {
        from {
          transform: translateY(24px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      /* ── CLOSE BUTTON ── */
      .accom-modal-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        width: 38px;
        height: 38px;
        background: rgba(26, 15, 7, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s;
        z-index: 20;
        border-radius: 2px;
      }
      .accom-modal-close:hover {
        background: rgba(192, 57, 43, 0.85);
      }

      /* ── MAIN BODY: left image | right content ── */
      .accom-modal-inner {
        display: grid;
        grid-template-columns: 1fr 1fr;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      /* ── LEFT: IMAGE PANEL ── */
      .accom-img-panel {
        position: relative;
        background: #1a0f07;
        overflow: hidden;
      }
      .accom-img-main {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        transition: opacity 0.4s ease;
      }
      /* Prev / Next arrow buttons */
      .accom-img-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.92);
        border: none;
        color: #3d2b1a;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 5;
        transition:
          background 0.2s,
          color 0.2s;
        border-radius: 50%;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
      }
      .accom-img-btn:hover {
        background: #c99a32;
        color: #fff;
      }
      .accom-img-btn.prev {
        left: 0.9rem;
      }
      .accom-img-btn.next {
        right: 0.9rem;
      }
      /* Dot indicators */
      .accom-img-dots {
        position: absolute;
        bottom: 0.9rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        z-index: 5;
      }
      .accom-img-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        border: none;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.2s;
        padding: 0;
      }
      .accom-img-dot.active {
        background: #c99a32;
        transform: scale(1.3);
      }
      /* Level badge over image */
      .accom-img-level {
        position: absolute;
        top: 1rem;
        left: 1rem;
        z-index: 6;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0.28rem 0.85rem;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border: 1px solid currentColor;
        background: rgba(26, 15, 7, 0.55);
        backdrop-filter: blur(4px);
      }
      /* Image count badge */
      .accom-img-count {
        position: absolute;
        bottom: 0.9rem;
        right: 1rem;
        z-index: 6;
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.75);
        letter-spacing: 1px;
        background: rgba(0, 0, 0, 0.4);
        padding: 0.2rem 0.55rem;
        border-radius: 20px;
      }

      /* ── RIGHT: CONTENT PANEL ── */
      .accom-content-panel {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding: 2.2rem 2rem 2rem;
        background: #fff;
        scrollbar-width: thin;
        scrollbar-color: #e8d9c0 #fff;
      }
      .accom-content-panel::-webkit-scrollbar {
        width: 4px;
      }
      .accom-content-panel::-webkit-scrollbar-thumb {
        background: #c99a32;
        border-radius: 2px;
      }

      /* Location line */
      .accom-popup-loc {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #c99a32;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }
      .accom-popup-loc i {
        font-size: 0.7rem;
      }

      /* Property name */
      .accom-popup-name {
        font-family: "Oswald", sans-serif;
        font-size: clamp(1.5rem, 3.5vw, 2rem);
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #1a0f07;
        line-height: 1.1;
        margin-bottom: 1.2rem;
      }

      /* Divider */
      .accom-popup-divider {
        height: 1px;
        background: #e8d9c0;
        margin-bottom: 1.2rem;
      }

      /* Description */
      .accom-popup-desc {
        font-size: 0.875rem;
        line-height: 1.8;
        color: #5a4a3a;
        margin-bottom: 1.6rem;
      }
      .accom-popup-desc p {
        margin-bottom: 0.8rem;
      }
      .accom-popup-desc p:last-child {
        margin-bottom: 0;
      }

      /* ACCOMMODATION HIGHLIGHTS heading */
      .accom-hl-heading {
        font-family: "Oswald", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #c99a32;
        margin-bottom: 0.9rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .accom-hl-heading::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e8d9c0;
      }

      /* Highlights 2-column checklist */
      .accom-hl-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem 0.8rem;
        margin-bottom: 1.6rem;
      }
      .accom-hl-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 0.82rem;
        color: #4a3828;
        line-height: 1.4;
        padding: 0.35rem 0;
        border-bottom: 1px solid #f0e8d6;
      }
      .accom-hl-item i {
        color: #27ae60;
        font-size: 0.7rem;
        margin-top: 3px;
        flex-shrink: 0;
        width: 14px;
      }

      /* Info row (level / location) */
      .accom-popup-info-strip {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
        margin-bottom: 1.6rem;
        padding: 0.9rem 1rem;
        background: #faf6ef;
        border: 1px solid #e8d9c0;
      }
      .accom-info-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.76rem;
        color: #574535;
      }
      .accom-info-chip i {
        color: #c99a32;
        font-size: 0.72rem;
      }
      .accom-info-chip strong {
        color: #1a0f07;
      }

      /* CTA buttons at bottom */
      .accom-popup-ctas {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        margin-top: auto;
        padding-top: 1rem;
        border-top: 1px solid #e8d9c0;
      }
      .accom-popup-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0.75rem 1rem;
        font-family: "Oswald", sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
      }
      .accom-popup-btn-primary {
        background: #3d2b1a;
        color: #f5edd0;
      }
      .accom-popup-btn-primary:hover {
        background: #574535;
      }
      .accom-popup-btn-wa {
        background: #25d366;
        color: #fff;
      }
      .accom-popup-btn-wa:hover {
        background: #1ebe5a;
      }

      /* Loading state */
      .accom-modal-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4rem 2rem;
        gap: 1rem;
        color: #6b5240;
        font-size: 0.85rem;
        min-height: 320px;
      }
      .accom-spin {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(87, 69, 53, 0.15);
        border-top-color: #c99a32;
        border-radius: 50%;
        animation: acspin 0.7s linear infinite;
      }
      @keyframes acspin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Clickable accommodation link in itinerary */
      .accom-link {
        color: #c99a32;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-weight: 600;
        transition: color 0.2s;
        text-decoration: none;
        border-bottom: 1px dashed rgba(201, 154, 50, 0.4);
      }
      .accom-link:hover {
        color: #d4aa44;
        border-bottom-color: rgba(212, 170, 68, 0.7);
      }
      .accom-link i {
        font-size: 0.7rem;
      }

      /* ── MOBILE: stack image on top, content below ── */
      @media (max-width: 680px) {
        .accom-modal {
          max-height: 95vh;
          flex-direction: column;
        }
        .accom-modal-inner {
          grid-template-columns: 1fr;
          overflow-y: auto;
        }
        .accom-img-panel {
          position: relative;
          height: 220px;
          flex-shrink: 0;
        }
        .accom-content-panel {
          padding: 1.5rem 1.2rem;
        }
        .accom-hl-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 400px) {
        .accom-popup-name {
          font-size: 1.3rem;
        }
        .accom-modal-overlay {
          padding: 0.5rem;
        }
      }
    </style>
  </head>

    <!-- Skeleton while loading -->
    <div id="pageContent">
      <div
        id="skeletonHero"
        class="skel skel-hero"
        style="margin-top: var(--nav-h)"
      ></div>
      <div class="skel-layout" id="skeletonBody">
        <div>
          <div class="skel skel-block w80"></div>
          <div class="skel skel-block w60"></div>
          <div class="skel skel-block w40"></div>
          <div class="skel skel-block w80" style="margin-top: 1.5rem"></div>
          <div class="skel skel-block w60"></div>
          <div class="skel skel-block"></div>
          <div class="skel skel-block w80" style="margin-top: 1.5rem"></div>
          <div class="skel skel-block w60"></div>

        </div>
        <div>

          <div
            class="skel skel-block"

          ></div>
        </div>
      </div>
    </div>

    <!-- ══════════════════════════════════════════
       ACCOMMODATION POPUP MODAL
  ══════════════════════════════════════════ -->
    <div
      class="accom-modal-overlay"
      id="accomPopupOverlay"
      onclick="closeAccomPopup(event)"
    >
      <div class="accom-modal" id="accomPopup">
        <div class="accom-modal-loading">
          <div class="accom-spin"></div>
          <span>Loading accommodation details…</span>
        </div>
      </div>
    </div>

    <a
      class="wa-btn"
      href="https://wa.me/255690318461"
      target="_blank"
      rel="noopener"
      ><i class="fa-brands fa-whatsapp"></i
    ></a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase-config.js"></script>
    <script src="../../js/main.js"></script>
    <script>
      /* ════════════════════════════════════════════════════════
     DYNAMIC TOUR DETAIL PAGE
     URL:  tour-packages/tour-detail.html?slug=classic-safari
  ════════════════════════════════════════════════════════ */

      const accomCache = {};
      let accomPopupActive = false;

      // Carousel state
      let _accomImages = [];
      let _accomIdx = 0;

      /* ── GET SLUG ─────────────────────────────────────────── */
      function getSlug() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("slug")) return params.get("slug");
        const file = window.location.pathname
          .split("/")
          .pop()
          .replace(".html", "");
        return file && file !== "tour-detail" ? file : null;
      }

      /* ── HELPERS ──────────────────────────────────────────── */
      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function safeJSON(v, fb) {
        if (!v) return fb;
        if (typeof v === "object") return v;
        try {
          return JSON.parse(v);
        } catch {
          return fb;
        }
      }
      function capitalize(s) {
        return String(s).charAt(0).toUpperCase() + String(s).slice(1);
      }

      /* ── FETCH + BOOT ─────────────────────────────────────── */
      async function boot() {
        const slug = getSlug();
        if (!slug) {
          showNotFound("No package slug provided in the URL.");
          return;
        }
        try {
          const { data, error } = await window._sb
            .from("packages")
            .select("*")
            .eq("slug", slug)
            .eq("is_active", true)
            .single();
          if (error || !data) {
            showNotFound(
              `Package "${slug}" was not found or is not currently active.`,
            );
            return;
          }
          render(data);
        } catch (e) {
          showNotFound("Failed to load package data. Please try again later.");
          console.error(e);
        }
      }

      /* ── RENDER FULL DETAIL PAGE ──────────────────────────── */
      function render(p) {
        document.title = p.meta_title || p.title + " – Seresafari Africa";
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc)
          metaDesc.setAttribute("content", p.meta_desc || p.short_desc || "");

        const inclusions = safeJSON(p.inclusions, []);
        const exclusions = safeJSON(p.exclusions, []);
        const highlights = safeJSON(p.highlights, []);
        const itinerary = safeJSON(p.itinerary, []);
        const price_tiers = safeJSON(p.price_tiers, []);
        const add_ons = safeJSON(p.add_ons, []);

        const html = `
      <!-- HERO -->
      <div class="detail-hero" style="margin-top:var(--nav-h);">
        <div class="detail-hero-bg" style="background-image:url('${esc(p.detail_hero_img || p.hero_image)}')"></div>
        <div class="detail-hero-content">
          <div class="detail-badge">
            <i class="fa-solid ${esc(p.badge_icon || "fa-star")}"></i>
            ${esc(p.badge_text || "Popular")}
          </div>
          <h1 class="detail-title">${esc(p.title)}</h1>
          <div class="detail-meta-strip">
            <div class="detail-meta-item">
              <i class="fa-regular fa-calendar"></i>
              <strong>${esc(p.duration_label || "")}</strong>
            </div>
            ${p.group_size ? `<div class="detail-meta-item"><i class="fa-solid fa-users"></i><strong>${esc(p.group_size)}</strong></div>` : ""}
          </div>
        </div>
      </div>

      <!-- CONTENT -->
      <div class="detail-layout">
        <div class="detail-main">

          <!-- OVERVIEW -->
          <div class="detail-block">
            <div class="detail-block-title"><i class="fa-solid fa-circle-info"></i> Tour Overview</div>
            <div>${p.overview_html || ""}</div>
          </div>

          <!-- HIGHLIGHTS -->
          ${
            highlights.length
              ? `
          <div class="detail-block">
            <div class="detail-block-title"><i class="fa-solid fa-wand-magic-sparkles"></i> Tour Highlights</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem">
              ${highlights.map((h) => `<span class="itin-sleep"><i class="fa-solid fa-check"></i> ${esc(h)}</span>`).join("")}
            </div>
          </div>`
              : ""
          }

          <!-- ITINERARY -->
          <div class="detail-block">
            <div class="detail-block-title"><i class="fa-solid fa-map-location-dot"></i> Day By Day Itinerary</div>
            ${
              itinerary.length
                ? `<div class="itinerary">${itinerary.map((day) => buildDayHTML(day)).join("")}</div>`
                : '<p style="color:var(--text);font-size:.85rem">Itinerary coming soon.</p>'
            }
          </div>

          <!-- INCLUSIONS / EXCLUSIONS -->
          ${
            inclusions.length || exclusions.length
              ? `
          <div class="detail-block">
            <div class="detail-block-title"><i class="fa-solid fa-list-check"></i> Included / Excluded</div>
            <div class="inc-exc-grid">
              <div class="inc-exc-box included">
                <h4><i class="fa-solid fa-circle-check"></i> What's Included</h4>
                <ul class="inc-exc-list">
                  ${inclusions.map((item) => `<li><i class="fa-solid fa-check ic"></i>${esc(item)}</li>`).join("")}
                </ul>
              </div>
              <div class="inc-exc-box excluded">
                <h4><i class="fa-solid fa-circle-xmark"></i> Not Included</h4>
                <ul class="inc-exc-list">
                  ${exclusions.map((item) => `<li><i class="fa-solid fa-xmark ic"></i>${esc(item)}</li>`).join("")}
                </ul>
              </div>
            </div>
          </div>`
              : ""
          }

          <!-- IMPORTANT NOTES -->
          <div class="detail-block">
            <div class="detail-block-title"><i class="fa-solid fa-triangle-exclamation"></i> Important Information</div>
            <div class="notes-grid">
              <div class="note-item"><i class="fa-solid fa-plane"></i>
                <p><strong>Flights:</strong> The nearest airport is Kilimanjaro International Airport (JRO), approximately 45 minutes from Arusha. We provide complimentary transfers from JRO or Arusha Airport. We recommend arriving the day before the safari starts.</p>

      /* ════════════════════════════════════════════════════════

  ════════════════════════════════════════════════════════ */

      async function openAccomPopup(accomId, accomName) {
        const overlay = document.getElementById("accomPopupOverlay");
        const popup = document.getElementById("accomPopup");

        popup.innerHTML = `<div class="accom-modal-loading">
      <div class="accom-spin"></div><span>Loading accommodation details…</span>
    </div>`;
        overlay.classList.add("open");
        document.body.style.overflow = "hidden";
        accomPopupActive = true;

        try {
          if (accomCache[accomId]) {
            renderAccomPopup(accomCache[accomId]);
            return;
          }
          const { data, error } = await window._sb
            .from("accommodations")
            .select("*")
            .eq("id", accomId)
            .eq("is_active", true)
            .single();
          if (error || !data) throw new Error("Accommodation not found");
          accomCache[accomId] = data;
          renderAccomPopup(data);
        } catch (e) {
          popup.innerHTML = `
        <div style="padding:3rem 2rem;text-align:center;color:#6B5240;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;">
          <i class="fa-solid fa-triangle-exclamation" style="font-size:2rem;color:#C99A32;opacity:.5"></i>
          <p style="font-size:.85rem">Could not load accommodation details.</p>
          <button onclick="closeAccomPopupDirect()" style="padding:.6rem 1.4rem;background:#3D2B1A;color:#F5EDD0;border:none;cursor:pointer;font-family:inherit;font-size:.78rem;letter-spacing:1px">Close</button>
        </div>`;
        }
      }

      async function openAccomPopupByName(name) {
        if (!name || name.trim() === "" || name === "None") return;
        const overlay = document.getElementById("accomPopupOverlay");
        const popup = document.getElementById("accomPopup");

        popup.innerHTML = `<div class="accom-modal-loading">
      <div class="accom-spin"></div><span>Loading ${esc(name)}…</span>
    </div>`;
        overlay.classList.add("open");
        document.body.style.overflow = "hidden";
        accomPopupActive = true;

        try {
          const { data, error } = await window._sb
            .from("accommodations")
            .select("*")
            .ilike("name", name.trim())
            .eq("is_active", true)
            .limit(1);

          if (error || !data?.length) throw new Error("Not found");
          const accom = data[0];
          accomCache[accom.id] = accom;
          renderAccomPopup(accom);
        } catch (e) {
          renderAccomPopupFallback(name);
        }
      }

      /* ── CAROUSEL HELPERS ─────────────────────────────────── */
      function accomGoTo(idx) {
        if (!_accomImages.length) return;
        _accomIdx = (idx + _accomImages.length) % _accomImages.length;
        const bg = document.getElementById("accomMainImg");
        if (bg)
          bg.style.backgroundImage = `url('${_accomImages[_accomIdx].url}')`;
        // Update dots
        document.querySelectorAll(".accom-img-dot").forEach((d, i) => {
          d.classList.toggle("active", i === _accomIdx);
        });
        // Update counter
        const counter = document.getElementById("accomImgCount");
        if (counter)
          counter.textContent = `${_accomIdx + 1} / ${_accomImages.length}`;
      }

      /* ── MAIN RENDER ──────────────────────────────────────── */
      function renderAccomPopup(accom) {
        const popup = document.getElementById("accomPopup");
        const images = safeJSON(accom.images, []);
        const highlights = safeJSON(accom.highlights, []);

        // Reset carousel state
        _accomImages = images.length ? images : [];
        _accomIdx = 0;
        const primaryImg =
          (_accomImages.find((i) => i.is_primary) || _accomImages[0])?.url ||
          "";

        const levelMap = {
          luxury: "#C99A32",
          midrange: "#7EB87A",
          budget: "#8A9BB0",
        };
        const levelColor = levelMap[accom.level] || levelMap.midrange;
        const levelIcon =
          accom.level === "luxury"
            ? "fa-crown"
            : accom.level === "budget"
              ? "fa-circle-dollar-to-slot"
              : "fa-circle-check";

        // Dots HTML
        const dotsHTML =
          _accomImages.length > 1
            ? `<div class="accom-img-dots">
          ${_accomImages.map((_, i) => `<button class="accom-img-dot ${i === 0 ? "active" : ""}" onclick="accomGoTo(${i})" aria-label="Image ${i + 1}"></button>`).join("")}
        </div>`
            : "";

        // Prev/Next arrows (only if multiple images)
        const arrowsHTML =
          _accomImages.length > 1
            ? `<button class="accom-img-btn prev" onclick="accomGoTo(_accomIdx - 1)" aria-label="Previous image">
           <i class="fa-solid fa-chevron-left"></i>
         </button>
         <button class="accom-img-btn next" onclick="accomGoTo(_accomIdx + 1)" aria-label="Next image">
           <i class="fa-solid fa-chevron-right"></i>
         </button>`
            : "";

        // Image count badge
        const countHTML =
          _accomImages.length > 1
            ? `<span class="accom-img-count" id="accomImgCount">1 / ${_accomImages.length}</span>`
            : "";

        // Highlights grid (2 columns, like A&K)
        const hlHTML = highlights.length
          ? `<div class="accom-hl-heading">
           <i class="fa-solid fa-wand-magic-sparkles"></i> Accommodation Highlights
         </div>
         <div class="accom-hl-grid">
           ${highlights
             .map(
               (h) => `
             <div class="accom-hl-item">
               <i class="fa-solid fa-circle-check"></i>
               <span>${esc(h)}</span>
             </div>`,
             )
             .join("")}
         </div>`
          : "";

        // Description paragraphs
        const descHTML = accom.description
          ? `<div class="accom-popup-desc">
           ${accom.description
             .split(/\n\n+/)
             .filter(Boolean)
             .map((para) => `<p>${esc(para.trim())}</p>`)
             .join("")}
         </div>`
          : "";

        // Info strip (level + location)
        const infoHTML = `
      <div class="accom-popup-info-strip">
        <div class="accom-info-chip">
          <i class="fa-solid fa-map-pin"></i>
          <strong>${esc(accom.location || "")}</strong>
        </div>
        <div class="accom-info-chip">
          <i class="fa-solid ${levelIcon}" style="color:${levelColor}"></i>
          <strong style="color:${levelColor}">${capitalize(accom.level || "midrange")}</strong>
        </div>
        ${_accomImages.length ? `<div class="accom-info-chip"><i class="fa-solid fa-images"></i><strong>${_accomImages.length} Photo${_accomImages.length !== 1 ? "s" : ""}</strong></div>` : ""}
      </div>`;

        popup.innerHTML = `
      <!-- CLOSE -->
      <button class="accom-modal-close" onclick="closeAccomPopupDirect()" title="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- SPLIT LAYOUT -->
      <div class="accom-modal-inner">

        <!-- LEFT: IMAGE PANEL -->
        <div class="accom-img-panel">
          <div class="accom-img-main" id="accomMainImg"
               style="background-image:url('${esc(primaryImg)}')"></div>

          <!-- Level badge -->
          <div class="accom-img-level" style="color:${levelColor}">
            <i class="fa-solid ${levelIcon}"></i>
            ${capitalize(accom.level || "midrange")}
          </div>

          ${arrowsHTML}
          ${dotsHTML}
          ${countHTML}
        </div>

        <!-- RIGHT: CONTENT PANEL -->
        <div class="accom-content-panel">

          <!-- Location -->
          <div class="accom-popup-loc">
            <i class="fa-solid fa-map-pin"></i>
            ${esc(accom.location || "")}
          </div>

          <!-- Name -->
          <div class="accom-popup-name">${esc(accom.name)}</div>

          <div class="accom-popup-divider"></div>

          <!-- Description -->
          ${descHTML}

          <!-- Highlights (the A&K section) -->
          ${hlHTML}

          <!-- Info strip -->
          ${infoHTML}

          <!-- CTAs -->
          <div class="accom-popup-ctas">
            <a href="../contact.html" class="accom-popup-btn accom-popup-btn-primary">
              <i class="fa-solid fa-paper-plane"></i> Enquire About This Stay
            </a>
            <a href="https://wa.me/255690318461?text=Hi%2C%20I'm%20interested%20in%20staying%20at%20${encodeURIComponent(accom.name)}"
               target="_blank" rel="noopener" class="accom-popup-btn accom-popup-btn-wa">
              <i class="fa-brands fa-whatsapp"></i> WhatsApp Us
            </a>
          </div>

        </div>
      </div>`;
      }

      /* ── FALLBACK (no DB record) ──────────────────────────── */
      function renderAccomPopupFallback(name) {
        const popup = document.getElementById("accomPopup");
        popup.innerHTML = `
      <button class="accom-modal-close" onclick="closeAccomPopupDirect()" title="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="accom-modal-inner" style="grid-template-columns:1fr">
        <div class="accom-content-panel" style="padding:2.5rem 2rem;text-align:center;align-items:center;justify-content:center;min-height:320px;">
          <i class="fa-solid fa-hotel" style="font-size:2.5rem;color:#C99A32;opacity:.5;margin-bottom:1rem;display:block"></i>
          <div class="accom-popup-name" style="margin-bottom:.5rem">${esc(name)}</div>
          <p style="font-size:.85rem;color:#6B5240;margin-bottom:1.5rem;line-height:1.6">Contact our team for full details, photos and availability for this property.</p>
          <div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;">
            <a href="../contact.html" class="accom-popup-btn accom-popup-btn-primary" style="min-width:140px;">
              <i class="fa-solid fa-paper-plane"></i> Enquire
            </a>
            <button onclick="closeAccomPopupDirect()" style="min-width:120px;padding:.75rem 1rem;background:transparent;border:1.5px solid #574535;color:#574535;font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;">
              Close
            </button>
          </div>
        </div>
      </div>`;
      }

      /* ── CLOSE ────────────────────────────────────────────── */
      function closeAccomPopup(event) {
        if (event.target === document.getElementById("accomPopupOverlay")) {
          closeAccomPopupDirect();
        }
      }
      function closeAccomPopupDirect() {
        const overlay = document.getElementById("accomPopupOverlay");
        overlay.classList.remove("open");
        document.body.style.overflow = "";
        accomPopupActive = false;
      }

      document.addEventListener("keydown", function (e) {
        if (!accomPopupActive) return;
        if (e.key === "Escape") closeAccomPopupDirect();
        if (e.key === "ArrowLeft" && _accomImages.length > 1)
          accomGoTo(_accomIdx - 1);
        if (e.key === "ArrowRight" && _accomImages.length > 1)
          accomGoTo(_accomIdx + 1);
      });

      /* ── NOT FOUND STATE ─────────────────────────────────── */
      function showNotFound(msg) {
        document.title = "Package Not Found – Seresafari Africa";
        document.getElementById("pageContent").innerHTML = `
      <div style="margin-top:var(--nav-h);background:var(--dark2);min-height:80vh">
        <div class="not-found">
          <i class="fa-solid fa-binoculars"></i>
          <h2>Package Not Found</h2>
          <p>${esc(msg)}</p>
          <a href="../tours.html" class="btn btn-primary">
            <i class="fa-solid fa-arrow-left"></i> Back to All Tours
          </a>
        </div>
      </div>
      <footer>
        <div class="footer-bot" style="padding:1.4rem 8%">
          <p>© 2026 Seresafari Africa. All Rights Reserved.</p>
          <div class="hakuna">Hakuna Matata <i class="fa-solid fa-earth-africa"></i></div>
        </div>
      </footer>`;
      }

      /* ── BOOT ────────────────────────────────────────────── */
      boot();
    </script>
  </body>
</html>
