     DYNAMIC TOUR DETAIL PAGE
     URL:  tour-packages/tour-detail.html?slug=classic-safari
     Also supports: classic-safari.html (filename = slug)
  ════════════════════════════════════════════════════════ */

  /* ── GET SLUG ─────────────────────────────────────────── */
  function getSlug() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('slug')) return params.get('slug');
    // Fallback: filename without .html
    const file = window.location.pathname.split('/').pop().replace('.html','');
    return (file && file !== 'tour-detail') ? file : null;
  }

  /* ── HELPERS ──────────────────────────────────────────── */
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function safeJSON(v, fb) {
    if (!v) return fb;
    if (typeof v === 'object') return v;
    try { return JSON.parse(v); } catch { return fb; }
  }
  function capitalize(s) {
    return String(s).charAt(0).toUpperCase() + String(s).slice(1);
  }

  /* ── FETCH + BOOT ─────────────────────────────────────── */
  async function boot() {
    const slug = getSlug();
    if (!slug) { showNotFound('No package slug provided in the URL.'); return; }

    try {
      const { data, error } = await window._sb
        .from('packages')
        .select('*')
        .eq('slug', slug)
        .eq('is_active', true)
        .single();

      if (error || !data) {
        showNotFound(`Package "${slug}" was not found or is not currently active.`);
        return;
      }
      render(data);
    } catch(e) {
      showNotFound('Failed to load package data. Please try again later.');
      console.error(e);
    }
  }

      <div class="detail-block reveal">
        <div class="detail-block-title"><i class="fa-solid fa-triangle-exclamation"></i> Important Information</div>
        <div class="notes-grid">
          ${notes.map(n => `
          <div class="note-item">
            <i class="fa-solid ${esc(n.icon||'fa-circle-info')}"></i>
            <p><strong>${esc(n.title||'')}${n.title?':':''}</strong> ${esc(n.body||'')}</p>
          </div>`).join('')}
        </div>
      </div>`;
  }

  /* ── DEFAULT NOTES (fallback) ─────────────────────────── */
  function buildDefaultNotes() {
    return `
      <div class="detail-block reveal">
        <div class="detail-block-title"><i class="fa-solid fa-triangle-exclamation"></i> Important Information</div>
        <div class="notes-grid">
          <div class="note-item"><i class="fa-solid fa-plane"></i><p><strong>Flights:</strong> The nearest airport is Kilimanjaro International Airport (JRO), approximately 45 minutes from Arusha. We provide complimentary transfers from JRO or Arusha Airport. We recommend arriving the day before your safari starts.</p></div>
          <div class="note-item"><i class="fa-solid fa-passport"></i><p><strong>Visa:</strong> Most nationalities can obtain a Tanzania e-Visa online at immigration.go.tz before departure. The fee is approximately $50 USD. Yellow Fever certificate may be required depending on your country of origin.</p></div>
          <div class="note-item"><i class="fa-solid fa-syringe"></i><p><strong>Health:</strong> Anti-malaria medication is strongly recommended. Consult your doctor at least 6 weeks before travel. Our guides carry comprehensive first aid kits and emergency oxygen on all game drives.</p></div>
          <div class="note-item"><i class="fa-solid fa-shield-halved"></i><p><strong>Insurance:</strong> Comprehensive travel insurance including medical evacuation cover is mandatory for all Seresafari guests. This is a non-negotiable requirement for your safety.</p></div>
          <div class="note-item"><i class="fa-solid fa-shirt"></i><p><strong>What to Wear:</strong> Neutral colours (khaki, tan, olive, green) are recommended on game drives. Avoid blue and black clothing as these attract tsetse flies. Bring layers — mornings can be cool, afternoons warm.</p></div>
          <div class="note-item"><i class="fa-solid fa-money-bill"></i><p><strong>Tipping:</strong> Tipping is customary and greatly appreciated. Recommended: Driver-Guide $15–20/day, Camp Staff $5–10/day per group. Tips are given directly to staff at the end of the safari.</p></div>
        </div>
      </div>`;
  }

  /* ── OTHER PACKAGES (sidebar + footer) ───────────────── */
  async function loadOtherPackages(currentSlug) {
    try {
      const { data } = await window._sb
        .from('packages')
        .select('title,slug,detail_url')
        .eq('is_active', true)
        .neq('slug', currentSlug)
        .order('sort_order')
        .limit(5);

      if (!data?.length) return;

      // Sidebar
      const box  = document.getElementById('otherToursBox');
      const list = document.getElementById('otherToursList');
      if (box && list) {
        list.innerHTML = data.map(p => `
          <a href="${esc(p.detail_url)}"
            style="display:flex;align-items:center;gap:.7rem;padding:.8rem;background:rgba(255,255,255,.03);border:1px solid rgba(201,150,58,.1);color:var(--cream2);font-size:.8rem;transition:border-color .3s;text-decoration:none"
            onmouseover="this.style.borderColor='rgba(201,150,58,.4)'"
            onmouseout="this.style.borderColor='rgba(201,150,58,.1)'">
            <i class="fa-solid fa-chevron-right" style="color:var(--gold);font-size:.7rem;flex-shrink:0"></i>
            ${esc(p.title)}
          </a>`).join('');
        box.style.display = 'block';
      }

      // Footer
      const footerUl = document.getElementById('footerPackageLinks');
      if (footerUl) {
        footerUl.innerHTML = data.map(p =>
          `<li><a href="${esc(p.detail_url)}"><i class="fa-solid fa-chevron-right"></i>${esc(p.title)}</a></li>`
        ).join('');
      }
    } catch(e) {
      console.warn('Could not load other packages', e);
    }
  }

  /* ── FORMAT TITLE: last key word in em ───────────────── */
  function formatTitle(title) {
    if (!title) return '';
    const keywords = ['Safari','Package','Journey','Adventure','Experience','Climb','Trek','Beach'];
    const words = title.split(' ');
    const lastWord = words[words.length - 1];
    if (keywords.includes(lastWord) && words.length > 1) {
      return esc(words.slice(0, -1).join(' ')) + ' <em>' + esc(lastWord) + '</em>';
    }
    return esc(title);
  }

  /* ── FORMAT DESTINATION TAGS ─────────────────────────── */
  function formatDestTags(tags) {
    if (!tags) return '';
    const map = {
      serengeti:'Serengeti', ngorongoro:'Ngorongoro', tarangire:'Tarangire',
      zanzibar:'Zanzibar', kilimanjaro:'Kilimanjaro', manyara:'Lake Manyara'
    };
    return tags.split(' ').map(t => map[t]||capitalize(t)).join(' · ');
  }

  /* ── NOT FOUND STATE ─────────────────────────────────── */
  function showNotFound(msg) {
    document.title = 'Package Not Found – Sere Safari Africa';
    document.getElementById('pageContent').innerHTML = `
      <div style="margin-top:var(--nav-h);background:var(--dark2);min-height:80vh">
        <div class="not-found">
          <i class="fa-solid fa-binoculars"></i>
          <h2>Package Not Found</h2>
          <p>${esc(msg)}</p>
          <a href="../tours.html" class="btn btn-primary">
            <i class="fa-solid fa-arrow-left"></i> Back to All Tours
          </a>
        </div>
      </div>
      <footer>
        <div class="footer-bot" style="padding:1.4rem 8%">
          <p>© 2026 Seresafari Africa. All Rights Reserved.</p>
          <div class="hakuna">Hakuna Matata <i class="fa-solid fa-earth-africa"></i></div>
        </div>
      </footer>`;
  }

  /* ── BOOT ────────────────────────────────────────────── */
  boot();
  </script>
