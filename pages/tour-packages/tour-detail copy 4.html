<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Loading… – Seresafari Africa</title>
    <meta name="description" content="" />
    <link rel="stylesheet" href="../../css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <style>
      /* ── SKELETON ── */
      .skel {
        background: linear-gradient(
          90deg,
          rgba(87, 69, 53, 0.08) 25%,
          rgba(87, 69, 53, 0.16) 50%,
          rgba(87, 69, 53, 0.08) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 2px;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      .skel-hero {
        height: 70vh;
        min-height: 480px;
      }
      .skel-block {
        height: 16px;
        margin-bottom: 0.7rem;
      }
      .skel-block.w80 {
        width: 80%;
      }
      .skel-block.w60 {
        width: 60%;
      }
      .skel-block.w40 {
        width: 40%;
      }
      .skel-layout {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 3rem;
        padding: 4rem 8%;
        background: var(--dark2);
      }
      @media (max-width: 900px) {
        .skel-layout {
          grid-template-columns: 1fr;
          padding: 3rem 5%;
        }
      }

      /* ── NOT FOUND ── */
      .not-found {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
        padding: 4rem 2rem;
      }
      .not-found i {
        font-size: 3rem;
        color: var(--gold);
        opacity: 0.4;
        margin-bottom: 1.2rem;
      }
      .not-found h2 {
        font-family: var(--ff-head);
        font-size: 2rem;
        color: var(--white);
        letter-spacing: 2px;
        margin-bottom: 0.7rem;
      }
      .not-found p {
        color: var(--text);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }

      /* ══════════════════════════════════════════
       SAFARI ROUTE MAP
    ══════════════════════════════════════════ */
      .safari-map-block {
        margin-bottom: 0;
        border: 1px solid rgba(201, 150, 58, 0.25);
        overflow: hidden;
        background: #1a0f07;
      }

      /* Map header bar */
      .safari-map-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.85rem 1.2rem;
        background: #3d2b1a;
        border-bottom: 1px solid rgba(201, 150, 58, 0.2);
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .safari-map-title {
        font-family: "Oswald", sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: #c99a32;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .safari-map-title i {
        font-size: 0.8rem;
      }
      .safari-map-legend {
        display: flex;
        align-items: center;
        gap: 1.1rem;
        flex-wrap: wrap;
      }
      .map-legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.65rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: rgba(245, 237, 208, 0.6);
      }
      .map-legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .map-legend-line {
        width: 20px;
        height: 2px;
        flex-shrink: 0;
        background: repeating-linear-gradient(
          90deg,
          #c99a32 0px,
          #c99a32 5px,
          transparent 5px,
          transparent 9px
        );
      }

      /* The actual Leaflet map */
      #safariRouteMap {
        width: 100%;
        height: 380px;
      }
      @media (max-width: 768px) {
        #safariRouteMap {
          height: 280px;
        }
      }

      /* Day progress strip under map */
      .safari-map-days {
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
        background: #2a1a0e;
        border-top: 1px solid rgba(201, 150, 58, 0.15);
        padding: 0.55rem 0.6rem;
        gap: 0.4rem;
      }
      .safari-map-days::-webkit-scrollbar {
        display: none;
      }
      .map-day-btn {
        flex-shrink: 0;
        min-width: 52px;
        padding: 0.4rem 0.6rem;
        background: rgba(201, 150, 58, 0.06);
        border: 1px solid rgba(201, 150, 58, 0.18);
        color: rgba(245, 237, 208, 0.55);
        font-family: "Oswald", sans-serif;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-align: center;
        cursor: pointer;
        transition: all 0.22s;
        border-radius: 2px;
        white-space: nowrap;
        line-height: 1.3;
      }
      .map-day-btn:hover {
        border-color: rgba(201, 150, 58, 0.55);
        color: #c99a32;
        background: rgba(201, 150, 58, 0.12);
      }
      .map-day-btn.active {
        background: #c99a32;
        border-color: #c99a32;
        color: #1a0f07;
      }
      .map-day-btn .day-num {
        font-size: 0.8rem;
        display: block;
      }
      .map-day-btn .day-loc {
        font-size: 0.58rem;
        opacity: 0.75;
        display: block;
        max-width: 72px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── ITINERARY DAY: clickable / active state ── */
      .itin-day {
        cursor: pointer;
        position: relative;
      }
      .itin-day.map-active {
        background: rgba(201, 150, 58, 0.07) !important;
      }
      .itin-day.map-active .itin-num {
        background: #c99a32;
      }
      .itin-day.map-active .day-label,
      .itin-day.map-active .day-number {
        color: #1a0f07 !important;
      }
      .itin-day.map-active .itin-num::after {
        opacity: 1;
      }

      /* Map "no location" notice */
      .map-no-location {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        flex-direction: column;
        gap: 0.8rem;
        color: rgba(245, 237, 208, 0.4);
        font-size: 0.8rem;
        letter-spacing: 1px;
        text-align: center;
        padding: 2rem;
      }
      .map-no-location i {
        font-size: 2rem;
        opacity: 0.3;
      }

      /* Tip bar between map and day strip */
      .safari-map-tip {
        padding: 0.4rem 1rem;
        background: #1a0f07;
        border-top: 1px solid rgba(201, 150, 58, 0.1);
        font-size: 0.62rem;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: rgba(245, 237, 208, 0.38);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .safari-map-tip i {
        color: #c99a32;
        font-size: 0.65rem;
        opacity: 0.6;
      }

      /* Custom Leaflet popup & marker styles */
      .leaflet-popup-content-wrapper {
        background: #3d2b1a !important;
        border: 1px solid rgba(201, 150, 58, 0.35) !important;
        border-radius: 2px !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45) !important;
        color: #f5edd0 !important;
      }
      .leaflet-popup-tip {
        background: #3d2b1a !important;
      }
      .leaflet-popup-content {
        margin: 0.75rem 1rem !important;
        min-width: 140px;
      }
      .map-popup-day {
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #c99a32;
        margin-bottom: 3px;
      }
      .map-popup-title {
        font-family: "Oswald", sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #f5edd0;
        line-height: 1.2;
        margin-bottom: 3px;
      }
      .map-popup-loc {
        font-size: 0.72rem;
        color: rgba(245, 237, 208, 0.6);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* Animated route line */
      @keyframes dashAnim {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* ══════════════════════════════════════════
       ACCOMMODATION POPUP MODAL — A&K-style layout
    ══════════════════════════════════════════ */
      .accom-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(26, 15, 7, 0.78);
        z-index: 9000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      .accom-modal-overlay.open {
        opacity: 1;
        pointer-events: all;
      }
      .accom-modal {
        background: #fff;
        max-width: 980px;
        width: 100%;
        max-height: 90vh;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        animation: accomIn 0.35s ease;
        border-radius: 2px;
      }
      @keyframes accomIn {
        from {
          transform: translateY(24px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .accom-modal-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        width: 38px;
        height: 38px;
        background: rgba(26, 15, 7, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s;
        z-index: 20;
        border-radius: 2px;
      }
      .accom-modal-close:hover {
        background: rgba(192, 57, 43, 0.85);
      }
      .accom-modal-inner {
        display: grid;
        grid-template-columns: 1fr 1fr;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .accom-img-panel {
        position: relative;
        background: #1a0f07;
        overflow: hidden;
      }
      .accom-img-main {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        transition: opacity 0.4s ease;
      }
      .accom-img-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.92);
        border: none;
        color: #3d2b1a;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 5;
        transition:
          background 0.2s,
          color 0.2s;
        border-radius: 50%;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
      }
      .accom-img-btn:hover {
        background: #c99a32;
        color: #fff;
      }
      .accom-img-btn.prev {
        left: 0.9rem;
      }
      .accom-img-btn.next {
        right: 0.9rem;
      }
      .accom-img-dots {
        position: absolute;
        bottom: 0.9rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        z-index: 5;
      }
      .accom-img-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        border: none;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.2s;
        padding: 0;
      }
      .accom-img-dot.active {
        background: #c99a32;
        transform: scale(1.3);
      }
      .accom-img-level {
        position: absolute;
        top: 1rem;
        left: 1rem;
        z-index: 6;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0.28rem 0.85rem;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border: 1px solid currentColor;
        background: rgba(26, 15, 7, 0.55);
        backdrop-filter: blur(4px);
      }
      .accom-img-count {
        position: absolute;
        bottom: 0.9rem;
        right: 1rem;
        z-index: 6;
        font-size: 0.65rem;
        color: rgba(255, 255, 255, 0.75);
        letter-spacing: 1px;
        background: rgba(0, 0, 0, 0.4);
        padding: 0.2rem 0.55rem;
        border-radius: 20px;
      }
      .accom-content-panel {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding: 2.2rem 2rem 2rem;
        background: #fff;
        scrollbar-width: thin;
        scrollbar-color: #e8d9c0 #fff;
      }
      .accom-content-panel::-webkit-scrollbar {
        width: 4px;
      }
      .accom-content-panel::-webkit-scrollbar-thumb {
        background: #c99a32;
        border-radius: 2px;
      }
      .accom-popup-loc {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #c99a32;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }
      .accom-popup-name {
        font-family: "Oswald", sans-serif;
        font-size: clamp(1.5rem, 3.5vw, 2rem);
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #1a0f07;
        line-height: 1.1;
        margin-bottom: 1.2rem;
      }
      .accom-popup-divider {
        height: 1px;
        background: #e8d9c0;
        margin-bottom: 1.2rem;
      }
      .accom-popup-desc {
        font-size: 0.875rem;
        line-height: 1.8;
        color: #5a4a3a;
        margin-bottom: 1.6rem;
      }
      .accom-popup-desc p {
        margin-bottom: 0.8rem;
      }
      .accom-popup-desc p:last-child {
        margin-bottom: 0;
      }
      .accom-hl-heading {
        font-family: "Oswald", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #c99a32;
        margin-bottom: 0.9rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .accom-hl-heading::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e8d9c0;
      }
      .accom-hl-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem 0.8rem;
        margin-bottom: 1.6rem;
      }
      .accom-hl-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 0.82rem;
        color: #4a3828;
        line-height: 1.4;
        padding: 0.35rem 0;
        border-bottom: 1px solid #f0e8d6;
      }
      .accom-hl-item i {
        color: #27ae60;
        font-size: 0.7rem;
        margin-top: 3px;
        flex-shrink: 0;
        width: 14px;
      }
      .accom-popup-info-strip {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
        margin-bottom: 1.6rem;
        padding: 0.9rem 1rem;
        background: #faf6ef;
        border: 1px solid #e8d9c0;
      }
      .accom-info-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.76rem;
        color: #574535;
      }
      .accom-info-chip i {
        color: #c99a32;
        font-size: 0.72rem;
      }
      .accom-info-chip strong {
        color: #1a0f07;
      }
      .accom-popup-ctas {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        margin-top: auto;
        padding-top: 1rem;
        border-top: 1px solid #e8d9c0;
      }
      .accom-popup-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0.75rem 1rem;
        font-family: "Oswald", sans-serif;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
      }
      .accom-popup-btn-primary {
        background: #3d2b1a;
        color: #f5edd0;
      }
      .accom-popup-btn-primary:hover {
        background: #574535;
      }
      .accom-popup-btn-wa {
        background: #25d366;
        color: #fff;
      }
      .accom-popup-btn-wa:hover {
        background: #1ebe5a;
      }
      .accom-modal-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4rem 2rem;
        gap: 1rem;
        color: #6b5240;
        font-size: 0.85rem;
        min-height: 320px;
      }
      .accom-spin {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(87, 69, 53, 0.15);
        border-top-color: #c99a32;
        border-radius: 50%;
        animation: acspin 0.7s linear infinite;
      }
      @keyframes acspin {
        to {
          transform: rotate(360deg);
        }
      }
      .accom-link {
        color: #c99a32;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-weight: 600;
        transition: color 0.2s;
        text-decoration: none;
        border-bottom: 1px dashed rgba(201, 154, 50, 0.4);
      }
      .accom-link:hover {
        color: #d4aa44;
        border-bottom-color: rgba(212, 170, 68, 0.7);
      }
      .accom-link i {
        font-size: 0.7rem;
      }

      @media (max-width: 680px) {
        .accom-modal {
          max-height: 95vh;
          flex-direction: column;
        }
        .accom-modal-inner {
          grid-template-columns: 1fr;
          overflow-y: auto;
        }
        .accom-img-panel {
          position: relative;
          height: 220px;
          flex-shrink: 0;
        }
        .accom-content-panel {
          padding: 1.5rem 1.2rem;
        }
        .accom-hl-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 400px) {
        .accom-popup-name {
          font-size: 1.3rem;
        }
        .accom-modal-overlay {
          padding: 0.5rem;
        }
      }
    </style>
  </head>

    <script>
      /* ════════════════════════════════════════════════════════
     DYNAMIC TOUR DETAIL PAGE
  ════════════════════════════════════════════════════════ */

      let _accomImages = [];
      let _accomIdx = 0;

      /* ════════════════════════════════════════════════════════

  ════════════════════════════════════════════════════════ */
      const SAFARI_LOCATIONS = {

        dodoma: [-6.1722, 35.7395],

        nairobi: [-1.2921, 36.8219],

      /* Resolve a day's location text → [lat, lng] or null
     Priority:
       1. Explicit lat/lng on the day object
       2. day.location field
       3. DESTINATION of day.route (text after →  -  –  to  via)
          e.g. "KIA → Arusha"         → Arusha
               "Arusha to Serengeti"  → Serengeti
       4. Full route / title substring match
       5. First 80 chars of description
  */
      function resolveLocation(day) {
        if (day.lat && day.lng)
          return [parseFloat(day.lat), parseFloat(day.lng)];

        function bestMatch(text) {
          const t = (text || "").toLowerCase().trim();
          if (!t) return null;
          if (SAFARI_LOCATIONS[t]) return SAFARI_LOCATIONS[t];
          let best = null,
            bestLen = 0;
          for (const [key, coords] of Object.entries(SAFARI_LOCATIONS)) {
            if (t.includes(key) && key.length > bestLen) {
              best = coords;
              bestLen = key.length;
            }
          }
          return best;
        }

        if (day.location) {
          const r = bestMatch(day.location);
          if (r) return r;
        }

        if (day.route) {
          const parts = day.route
            .split(/[→>\-–]|\bto\b|\bvia\b/i)
            .map((s) => s.trim())
            .filter(Boolean);
          for (const part of [...parts].reverse()) {
            const r = bestMatch(part);
            if (r) return r;
          }
          const r = bestMatch(day.route);
          if (r) return r;
        }

        if (day.title) {
          const r = bestMatch(day.title);
          if (r) return r;
        }
        if (day.description) {
          const r = bestMatch(day.description.slice(0, 80));
          if (r) return r;
        }
        return null;
      }

      /* ════════════════════════════════════════════════════════
     MAP ENGINE — Animated Safari Route
     
     Behaviour:
       • Ghost route (full dotted line, very dim) always visible
       • Solid animated line draws from Day 1 → selected day
       • Each new segment animates with requestAnimationFrame
       • A moving jeep marker travels along the new segment
       • Markers: inactive = small dark pin, active = large gold pin
       • Clicking day card OR day strip button triggers the animation
  ════════════════════════════════════════════════════════ */

      let _map = null;
      let _mapDayCoords = []; // [{day, title, locationLabel, coords}]
      let _mapMarkers = {}; // { dayNum: L.marker }
      let _mapActiveDay = -1;
      let _mapDrawnUpTo = -1; // highest day number whose line has been drawn
      let _ghostLine = null; // full dim route
      let _progressLines = {}; // { "1-2": L.polyline, "2-3": L.polyline, … }
      let _jeepMarker = null;
      let _animRaf = null; // current animation frame id

      /* ── ICON FACTORY ─────────────────────────────────────── */
      function makeIcon(label, state) {
        // state: 'inactive' | 'active' | 'visited'
        const configs = {
          inactive: {
            bg: "#3D2B1A",
            fg: "#C99A32",
            stroke: "#C99A32",
            sw: 1.5,
            size: 28,
          },
          visited: {
            bg: "#574535",
            fg: "#C99A32",
            stroke: "#C99A32",
            sw: 1.5,
            size: 28,
          },
          active: {
            bg: "#C99A32",
            fg: "#1A0F07",
            stroke: "#1A0F07",
            sw: 2,
            size: 38,
          },
        };
        const c = configs[state] || configs.inactive;
        const h = Math.round(c.size * 1.4);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${c.size}" height="${h}" viewBox="0 0 40 56">
      <path d="M20 0C9 0 0 9 0 20c0 15 20 36 20 36s20-21 20-36C40 9 31 0 20 0z"
            fill="${c.bg}" stroke="${c.stroke}" stroke-width="${c.sw}"/>
      <text x="20" y="${state === "active" ? 25 : 22}" text-anchor="middle" fill="${c.fg}"
            font-family="Oswald,sans-serif" font-weight="700"
            font-size="${state === "active" ? 14 : 11}">${label}</text>
    </svg>`;
        return L.divIcon({
          html: svg,
          iconSize: [c.size, h],
          iconAnchor: [c.size / 2, h],
          popupAnchor: [0, -h],
          className: "",
        });
      }

      /* Moving jeep icon */
      function makeJeepIcon() {
        return L.divIcon({
          html: `<div style="
        width:28px;height:28px;
        background:#C99A32;
        border:2px solid #1A0F07;
        border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 0 0 3px rgba(201,154,50,.35),0 3px 10px rgba(0,0,0,.5);
        font-size:13px;line-height:1;
      ">🚙</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14],
          className: "",
        });
      }

      /* ── MAP INIT ─────────────────────────────────────────── */
      function initMap(dayData) {
        _mapDayCoords = dayData;
        const valid = dayData.filter((d) => d.coords);
        if (!valid.length) return;

        if (_map) {
          _map.remove();
          _map = null;
        }

        _map = L.map("safariRouteMap", {
          zoomControl: true,
          scrollWheelZoom: false,
          attributionControl: false,
        });

        // Warm earthy map tiles (CartoDB Voyager — roads + terrain labels)
        L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
          {
            maxZoom: 15,
            subdomains: "abcd",
          },
        ).addTo(_map);

        L.control
          .attribution({ prefix: "© OpenStreetMap © CARTO" })
          .addTo(_map);

        // Ghost route — full dim dashed line
        const allCoords = valid.map((d) => d.coords);
        _ghostLine = L.polyline(allCoords, {
          color: "#C99A32",
          weight: 2,
          opacity: 0.18,
          dashArray: "6 5",
        }).addTo(_map);

        // Markers for every day
        _mapMarkers = {};
        valid.forEach((d) => {
          const m = L.marker(d.coords, {
            icon: makeIcon(d.day, "inactive"),
            zIndexOffset: 0,
          }).addTo(_map);

          m.bindPopup(
            `<div class="map-popup-day">Day ${d.day}</div>
         <div class="map-popup-title">${escHTML(d.title)}</div>
         <div class="map-popup-loc">
           <i class="fa-solid fa-map-pin" style="color:#C99A32;font-size:.6rem"></i>
           ${escHTML(d.locationLabel)}
         </div>`,
            { maxWidth: 220, closeButton: false },
          );

          m.on("click", () => {
            selectDay(d.day, true);
          });

          _mapMarkers[d.day] = m;
        });

        // Fit view to full route
        _map.fitBounds(_ghostLine.getBounds().pad(0.2));

        // Reset progress state
        _progressLines = {};
        _mapDrawnUpTo = -1;
        _mapActiveDay = -1;
      }

      /* ════════════════════════════════════════════════════════
     ANIMATED SEGMENT DRAWING
     
     animateSegment(fromCoords, toCoords, onDone)
       — draws a solid gold line from → to using rAF
       — moves the jeep marker along the segment
       — calls onDone() when finished
  ════════════════════════════════════════════════════════ */
      function animateSegment(fromCoords, toCoords, segKey, duration, onDone) {
        if (_animRaf) {
          cancelAnimationFrame(_animRaf);
          _animRaf = null;
        }

        // Remove previous segment line if re-drawing
        if (_progressLines[segKey]) {
          _progressLines[segKey].remove();
          delete _progressLines[segKey];
        }

        // Place or move jeep to start
        if (!_jeepMarker) {
          _jeepMarker = L.marker(fromCoords, {
            icon: makeJeepIcon(),
            zIndexOffset: 9000,
          }).addTo(_map);
        } else {
          _jeepMarker.setLatLng(fromCoords);
        }

        // The growing polyline for this segment
        const segLine = L.polyline([fromCoords, fromCoords], {
          color: "#C99A32",
          weight: 4,
          opacity: 0.95,
        }).addTo(_map);
        _progressLines[segKey] = segLine;

        const start = performance.now();
        const [lat1, lng1] = fromCoords;
        const [lat2, lng2] = toCoords;

        function frame(now) {
          const t = Math.min((now - start) / duration, 1);
          // Ease in-out cubic
          const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

          const lat = lat1 + (lat2 - lat1) * e;
          const lng = lng1 + (lng2 - lng1) * e;

          segLine.setLatLngs([fromCoords, [lat, lng]]);
          _jeepMarker.setLatLng([lat, lng]);

          if (t < 1) {
            _animRaf = requestAnimationFrame(frame);
          } else {
            segLine.setLatLngs([fromCoords, toCoords]);
            _jeepMarker.setLatLng(toCoords);
            _animRaf = null;
            if (onDone) onDone();
          }
        }

        _animRaf = requestAnimationFrame(frame);
      }

      /* ════════════════════════════════════════════════════════
     SELECT DAY — main entry point
     
     When dayNum > _mapDrawnUpTo:
       animate each missing segment in sequence
     When dayNum < _mapDrawnUpTo:
       remove excess segments and rewind
     When dayNum === _mapDrawnUpTo:
       just fly + popup
  ════════════════════════════════════════════════════════ */
      function selectDay(dayNum, fromMarker) {
        if (!_map) return;
        _mapActiveDay = dayNum;

        // ── Update UI: day strip buttons
        document.querySelectorAll(".map-day-btn").forEach((btn) => {
          btn.classList.toggle("active", parseInt(btn.dataset.day) === dayNum);
        });
        // Keep active day button in view
        setTimeout(() => scrollDayStripToActive(dayNum), 50);

        // ── Update UI: itinerary rows
        document.querySelectorAll(".itin-day").forEach((row) => {
          const rDay = parseInt(row.dataset.day);
          row.classList.toggle("map-active", rDay === dayNum);
        });

        // ── Update all marker states
        _mapDayCoords.forEach((d) => {
          const m = _mapMarkers[d.day];
          if (!m) return;
          if (d.day === dayNum) m.setIcon(makeIcon(d.day, "active"));
          else if (d.day < dayNum) m.setIcon(makeIcon(d.day, "visited"));
          else m.setIcon(makeIcon(d.day, "inactive"));
        });

        // ── Determine direction
        const validDays = _mapDayCoords
          .filter((d) => d.coords)
          .sort((a, b) => a.day - b.day);

        if (dayNum < _mapDrawnUpTo) {
          // REWIND: cancel any running animation
          if (_animRaf) {
            cancelAnimationFrame(_animRaf);
            _animRaf = null;
          }

          // Remove all segment lines where the destination day > dayNum
          Object.keys(_progressLines).forEach((key) => {
            const toDay = parseInt(key.split("-")[1]);
            if (toDay > dayNum) {
              _progressLines[key].remove();
              delete _progressLines[key];
            }
          });
          _mapDrawnUpTo = dayNum;

          // Move jeep back to this day's location
          const dayData = _mapDayCoords.find((d) => d.day === dayNum);
          if (dayData?.coords) {
            if (_jeepMarker) _jeepMarker.setLatLng(dayData.coords);
            else
              _jeepMarker = L.marker(dayData.coords, {
                icon: makeJeepIcon(),
                zIndexOffset: 9000,
              }).addTo(_map);
          }

          finishSelectDay(dayNum, fromMarker);
          return;
        }

        if (dayNum === _mapDrawnUpTo || _mapDrawnUpTo === -1) {
          // Same day or first day — just position jeep, no animation
          _mapDrawnUpTo = dayNum;
          const dayData = _mapDayCoords.find((d) => d.day === dayNum);
          if (dayData?.coords && _jeepMarker)
            _jeepMarker.setLatLng(dayData.coords);
          else if (dayData?.coords) {
            _jeepMarker = L.marker(dayData.coords, {
              icon: makeJeepIcon(),
              zIndexOffset: 9000,
            }).addTo(_map);
          }
          finishSelectDay(dayNum, fromMarker);
          return;
        }

        // FORWARD: animate each new segment from _mapDrawnUpTo → dayNum
        // Build the chain of segments to animate
        const segmentsToAnimate = [];
        let prevDay = _mapDrawnUpTo;

        for (const vd of validDays) {
          if (vd.day <= _mapDrawnUpTo) continue;
          if (vd.day > dayNum) break;

          // Find the last valid day before this one
          const prevValid = [...validDays]
            .reverse()
            .find((v) => v.day <= prevDay && v.day !== vd.day);
          const fromCoords = prevValid ? prevValid.coords : validDays[0].coords;
          segmentsToAnimate.push({
            from: fromCoords,
            to: vd.coords,
            key: `${prevDay}-${vd.day}`,
            day: vd.day,
          });
          prevDay = vd.day;
        }

        if (!segmentsToAnimate.length) {
          _mapDrawnUpTo = dayNum;
          finishSelectDay(dayNum, fromMarker);
          return;
        }

        // Animate segments in sequence
        const totalSegs = segmentsToAnimate.length;
        // Duration per segment: shorter for multi-step jumps so it doesn't feel sluggish
        const segDuration =
          totalSegs === 1 ? 1200 : Math.max(600, 1800 / totalSegs);

        function animateNext(idx) {
          if (idx >= segmentsToAnimate.length) {
            _mapDrawnUpTo = dayNum;
            finishSelectDay(dayNum, fromMarker);
            return;
          }
          const seg = segmentsToAnimate[idx];
          animateSegment(seg.from, seg.to, seg.key, segDuration, () =>
            animateNext(idx + 1),
          );
        }

        animateNext(0);
      }

      /* After animation: fly map + open popup */
      function finishSelectDay(dayNum, fromMarker) {
        const dayData = _mapDayCoords.find((d) => d.day === dayNum);
        if (!dayData || !dayData.coords) return;

        // Decide zoom: if we have multiple days drawn, show the full drawn route
        // Otherwise zoom into the active location
        const drawnDays = _mapDayCoords.filter(
          (d) => d.coords && d.day <= _mapDrawnUpTo,
        );

        if (drawnDays.length > 1) {
          const bounds = L.latLngBounds(drawnDays.map((d) => d.coords)).pad(
            0.25,
          );
          _map.flyToBounds(bounds, {
            animate: true,
            duration: 0.9,
            maxZoom: 10,
          });
        } else {
          _map.flyTo(dayData.coords, 9, { animate: true, duration: 0.9 });
        }

        // Open popup after fly completes
        const m = _mapMarkers[dayNum];
        if (m)
          setTimeout(() => {
            m.openPopup();
          }, 900);
      }

      /* ── LEGACY COMPAT WRAPPERS (called from HTML onclick) ── */
      function activateDay(dayNum, fromMarker) {
        selectDay(dayNum, fromMarker);
      }
      function showRouteTo(dayNum) {
        // No-op — selectDay handles everything now
      }

      /* Fit map back to full route bounds */
      function resetMapView() {
        if (!_map || !_ghostLine) return;
        _map.fitBounds(_ghostLine.getBounds().pad(0.2), {
          animate: true,
          duration: 0.7,
        });
      }

      /* Auto-scroll the day strip to keep the active button visible */
      function scrollDayStripToActive(dayNum) {
        const strip = document.querySelector(".safari-map-days");
        const btn = document.querySelector(
          `.map-day-btn[data-day="${dayNum}"]`,
        );
        if (!strip || !btn) return;
        const btnLeft = btn.offsetLeft;
        const btnWidth = btn.offsetWidth;
        const stripW = strip.offsetWidth;
        const scrollTo = btnLeft - stripW / 2 + btnWidth / 2;
        strip.scrollTo({ left: scrollTo, behavior: "smooth" });
      }

      /* ── HELPERS ──────────────────────────────────────────── */
      function getSlug() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("slug")) return params.get("slug");
        const file = window.location.pathname
          .split("/")
          .pop()
          .replace(".html", "");
        return file && file !== "tour-detail" ? file : null;
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escHTML(s) {
        return String(s || "")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function safeJSON(v, fb) {
        if (!v) return fb;
        if (typeof v === "object") return v;
        try {
          return JSON.parse(v);
        } catch {
          return fb;
        }
      }
      function capitalize(s) {
        return String(s).charAt(0).toUpperCase() + String(s).slice(1);
      }

      /* Short location label — show destination of route strings */
      function locationLabel(day) {
        if (day.location) return day.location;
        if (day.route) {
          // Extract last segment of "A → B" or "A to B"
          const parts = day.route
            .split(/[→>\-–]|\bto\b|\bvia\b/i)
            .map((s) => s.trim())
            .filter(Boolean);
          return parts[parts.length - 1] || day.route;
        }
        return day.title || "";
      }

      /* ── FETCH + BOOT ─────────────────────────────────────── */
      async function boot() {
        const slug = getSlug();
        if (!slug) {
          showNotFound("No package slug provided in the URL.");
          return;
        }
        try {
          const { data, error } = await window._sb
            .from("packages")
            .select("*")
            .eq("slug", slug)
            .eq("is_active", true)
            .single();
          if (error || !data) {
            showNotFound(
              `Package "${slug}" was not found or is not currently active.`,
            );
            return;
          }
          render(data);
        } catch (e) {
          showNotFound("Failed to load package data. Please try again later.");
          console.error(e);
        }
      }

      /* ── RENDER FULL DETAIL PAGE ──────────────────────────── */
      function render(p) {
        document.title = p.meta_title || p.title + " – Seresafari Africa";
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc)
          metaDesc.setAttribute("content", p.meta_desc || p.short_desc || "");

        const inclusions = safeJSON(p.inclusions, []);
        const exclusions = safeJSON(p.exclusions, []);
        const highlights = safeJSON(p.highlights, []);
        const itinerary = safeJSON(p.itinerary, []);
        const price_tiers = safeJSON(p.price_tiers, []);
        const add_ons = safeJSON(p.add_ons, []);

        // ── Pre-resolve map data ──────────────────────────────
        const mapDayData = itinerary.map((day) => ({
          day: day.day,
          title: day.title || "",
          locationLabel: locationLabel(day),
          coords: resolveLocation(day),
        }));
        const hasMap = mapDayData.some((d) => d.coords);

        overlay.classList.add("open");
        document.body.style.overflow = "hidden";
        accomPopupActive = true;
        try {
          if (accomCache[accomId]) {
            renderAccomPopup(accomCache[accomId]);
            return;
          }
          const { data, error } = await window._sb
            .from("accommodations")
            .select("*")
            .eq("id", accomId)
            .eq("is_active", true)
            .single();
          if (error || !data) throw new Error("Not found");
          accomCache[accomId] = data;
          renderAccomPopup(data);
        } catch (e) {
          popup.innerHTML = `<div style="padding:3rem 2rem;text-align:center;color:#6B5240;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:2rem;color:#C99A32;opacity:.5"></i>
        <p style="font-size:.85rem">Could not load accommodation details.</p>
        <button onclick="closeAccomPopupDirect()" style="padding:.6rem 1.4rem;background:#3D2B1A;color:#F5EDD0;border:none;cursor:pointer;font-family:inherit;font-size:.78rem;letter-spacing:1px">Close</button>
      </div>`;
        }
      }

      async function openAccomPopupByName(name) {
        if (!name || name.trim() === "" || name === "None") return;
        const overlay = document.getElementById("accomPopupOverlay");
        const popup = document.getElementById("accomPopup");
        popup.innerHTML = `<div class="accom-modal-loading"><div class="accom-spin"></div><span>Loading ${esc(name)}…</span></div>`;
        overlay.classList.add("open");
        document.body.style.overflow = "hidden";
        accomPopupActive = true;
        try {
          const { data, error } = await window._sb
            .from("accommodations")
            .select("*")
            .ilike("name", name.trim())
            .eq("is_active", true)
            .limit(1);
          if (error || !data?.length) throw new Error("Not found");
          accomCache[data[0].id] = data[0];
          renderAccomPopup(data[0]);
        } catch (e) {
          renderAccomPopupFallback(name);
        }
      }

      function accomGoTo(idx) {
        if (!_accomImages.length) return;
        _accomIdx = (idx + _accomImages.length) % _accomImages.length;
        const bg = document.getElementById("accomMainImg");
        if (bg)
          bg.style.backgroundImage = `url('${_accomImages[_accomIdx].url}')`;
        document
          .querySelectorAll(".accom-img-dot")
          .forEach((d, i) => d.classList.toggle("active", i === _accomIdx));
        const counter = document.getElementById("accomImgCount");
        if (counter)
          counter.textContent = `${_accomIdx + 1} / ${_accomImages.length}`;
      }

      function renderAccomPopup(accom) {
        const popup = document.getElementById("accomPopup");
        const images = safeJSON(accom.images, []);
        const highlights = safeJSON(accom.highlights, []);
        _accomImages = images;
        _accomIdx = 0;
        const primaryImg =
          (_accomImages.find((i) => i.is_primary) || _accomImages[0])?.url ||
          "";
        const levelMap = {
          luxury: "#C99A32",
          midrange: "#7EB87A",
          budget: "#8A9BB0",
        };
        const levelColor = levelMap[accom.level] || levelMap.midrange;
        const levelIcon =
          accom.level === "luxury"
            ? "fa-crown"
            : accom.level === "budget"
              ? "fa-circle-dollar-to-slot"
              : "fa-circle-check";

        popup.innerHTML = `
      <button class="accom-modal-close" onclick="closeAccomPopupDirect()" title="Close"><i class="fa-solid fa-xmark"></i></button>
      <div class="accom-modal-inner">
        <div class="accom-img-panel">
          <div class="accom-img-main" id="accomMainImg" style="background-image:url('${esc(primaryImg)}')"></div>
          <div class="accom-img-level" style="color:${levelColor}">
            <i class="fa-solid ${levelIcon}"></i>${capitalize(accom.level || "midrange")}
          </div>
          ${
            _accomImages.length > 1
              ? `
            <button class="accom-img-btn prev" onclick="accomGoTo(_accomIdx-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <button class="accom-img-btn next" onclick="accomGoTo(_accomIdx+1)"><i class="fa-solid fa-chevron-right"></i></button>
            <div class="accom-img-dots">${_accomImages.map((_, i) => `<button class="accom-img-dot ${i === 0 ? "active" : ""}" onclick="accomGoTo(${i})"></button>`).join("")}</div>
            <span class="accom-img-count" id="accomImgCount">1 / ${_accomImages.length}</span>
          `
              : ""
          }
        </div>
        <div class="accom-content-panel">
          <div class="accom-popup-loc"><i class="fa-solid fa-map-pin"></i>${esc(accom.location || "")}</div>
          <div class="accom-popup-name">${esc(accom.name)}</div>
          <div class="accom-popup-divider"></div>
          ${
            accom.description
              ? `<div class="accom-popup-desc">${accom.description
                  .split(/\n\n+/)
                  .filter(Boolean)
                  .map((p) => `<p>${esc(p.trim())}</p>`)
                  .join("")}</div>`
              : ""
          }
          ${
            highlights.length
              ? `
            <div class="accom-hl-heading"><i class="fa-solid fa-wand-magic-sparkles"></i> Accommodation Highlights</div>
            <div class="accom-hl-grid">${highlights.map((h) => `<div class="accom-hl-item"><i class="fa-solid fa-circle-check"></i><span>${esc(h)}</span></div>`).join("")}</div>
          `
              : ""
          }
          <div class="accom-popup-info-strip">
            <div class="accom-info-chip"><i class="fa-solid fa-map-pin"></i><strong>${esc(accom.location || "")}</strong></div>
            <div class="accom-info-chip"><i class="fa-solid ${levelIcon}" style="color:${levelColor}"></i><strong style="color:${levelColor}">${capitalize(accom.level || "midrange")}</strong></div>
            ${_accomImages.length ? `<div class="accom-info-chip"><i class="fa-solid fa-images"></i><strong>${_accomImages.length} Photo${_accomImages.length !== 1 ? "s" : ""}</strong></div>` : ""}
          </div>
          
        </div>
      </div>`;
      }
      // <div class="accom-popup-ctas">
      //   <a href="../contact.html" class="accom-popup-btn accom-popup-btn-primary"><i class="fa-solid fa-paper-plane"></i> Enquire About This Stay</a>
      //   <a href="https://wa.me/255690318461?text=Hi%2C%20I'm%20interested%20in%20${encodeURIComponent(accom.name)}" target="_blank" rel="noopener" class="accom-popup-btn accom-popup-btn-wa"><i class="fa-brands fa-whatsapp"></i> WhatsApp Us</a>
      // </div>

      function renderAccomPopupFallback(name) {
        const popup = document.getElementById("accomPopup");
        popup.innerHTML = `
      <button class="accom-modal-close" onclick="closeAccomPopupDirect()"><i class="fa-solid fa-xmark"></i></button>
      <div class="accom-modal-inner" style="grid-template-columns:1fr">
        <div class="accom-content-panel" style="padding:2.5rem 2rem;text-align:center;align-items:center;justify-content:center;min-height:320px;">
          <i class="fa-solid fa-hotel" style="font-size:2.5rem;color:#C99A32;opacity:.5;margin-bottom:1rem;display:block"></i>
          <div class="accom-popup-name" style="margin-bottom:.5rem">${esc(name)}</div>
          <p style="font-size:.85rem;color:#6B5240;margin-bottom:1.5rem;line-height:1.6">Contact our team for full details, photos and availability for this property.</p>
          <div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;">
            <a href="../contact.html" class="accom-popup-btn accom-popup-btn-primary" style="min-width:140px;"><i class="fa-solid fa-paper-plane"></i> Enquire</a>
            <button onclick="closeAccomPopupDirect()" style="min-width:120px;padding:.75rem 1rem;background:transparent;border:1.5px solid #574535;color:#574535;font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;">Close</button>
          </div>
        </div>
      </div>`;
      }

      function closeAccomPopup(event) {
        if (event.target === document.getElementById("accomPopupOverlay"))
          closeAccomPopupDirect();
      }
      function closeAccomPopupDirect() {
        document.getElementById("accomPopupOverlay").classList.remove("open");
        document.body.style.overflow = "";
        accomPopupActive = false;
      }

      document.addEventListener("keydown", function (e) {
        if (accomPopupActive) {
          if (e.key === "Escape") closeAccomPopupDirect();
          if (e.key === "ArrowLeft" && _accomImages.length > 1)
            accomGoTo(_accomIdx - 1);
          if (e.key === "ArrowRight" && _accomImages.length > 1)
            accomGoTo(_accomIdx + 1);
        }
      });

      /* ── NOT FOUND ────────────────────────────────────────── */
      function showNotFound(msg) {
        document.title = "Package Not Found – Seresafari Africa";
        document.getElementById("pageContent").innerHTML = `
      <div style="margin-top:var(--nav-h);background:var(--dark2);min-height:80vh">
        <div class="not-found">
          <i class="fa-solid fa-binoculars"></i>
          <h2>Package Not Found</h2>
          <p>${esc(msg)}</p>
          <a href="../tours.html" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Back to All Tours</a>
        </div>
      </div>
      <footer><div class="footer-bot" style="padding:1.4rem 8%">
        <p>© 2026 Seresafari Africa. All Rights Reserved.</p>
        <div class="hakuna">Hakuna Matata <i class="fa-solid fa-earth-africa"></i></div>
      </div></footer>`;
      }

      boot();
    </script>
  </body>
</html>
