      .skel {

      }
      @keyframes shimmer {

      .skel-hero {

      .not-found {

      /* ── ARTICLE BODY TYPOGRAPHY ── */

      }

      .article-body h2,

      /* ── META STRIP ── */

      /* ── TAGS ── */

      /* ── SHARE ROW ── */

      /* ── RELATED POSTS GRID (bottom of article) ── */

    <script>
      /* ════════════════════════════════════════════════════════
     CATEGORY METADATA
  ════════════════════════════════════════════════════════ */
      const CAT_META = {
        general: { icon: "fa-newspaper", label: "General" },
        wildlife: { icon: "fa-paw", label: "Wildlife" },
        destinations: { icon: "fa-map-location-dot", label: "Destinations" },
        "travel-tips": { icon: "fa-lightbulb", label: "Travel Tips" },
        conservation: { icon: "fa-leaf", label: "Conservation" },
        itineraries: { icon: "fa-route", label: "Itineraries" },
        culture: { icon: "fa-people-group", label: "Culture" },
        gear: { icon: "fa-backpack", label: "Gear & Packing" },
        news: { icon: "fa-bullhorn", label: "News & Updates" },
      };

      /* ════════════════════════════════════════════════════════
     HELPERS
  ════════════════════════════════════════════════════════ */
      function getSlug() {
        const params = new URLSearchParams(window.location.search);
        if (params.get("slug")) return params.get("slug");
        const file = window.location.pathname
          .split("/")
          .pop()
          .replace(".html", "");
        return file && file !== "blog-detail" ? file : null;
      }
      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function fmtDate(val) {
        if (!val) return "—";
        try {
          return new Date(val).toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "long",
            year: "numeric",
          });
        } catch {
          return "—";
        }
      }
      function estimateReadTime(post) {
        if (post.read_time_mins) return post.read_time_mins;
        const text = (post.content_html || post.excerpt || "").replace(
          /<[^>]+>/g,
          " ",
        );
        const words = text.trim().split(/\s+/).filter(Boolean).length;
        return Math.max(1, Math.round(words / 200));
      }
      function initials(name) {
        const parts = (name || "Seresafari Africa").trim().split(/\s+/);
        return ((parts[0]?.[0] || "S") + (parts[1]?.[0] || "")).toUpperCase();
      }

      /* ════════════════════════════════════════════════════════
     BOOT
  ════════════════════════════════════════════════════════ */
      async function boot() {
        const slug = getSlug();
        if (!slug) {
          showNotFound("No post slug provided in the URL.");
          return;
        }
        try {
          const { data, error } = await window._sb
            .from("blogs")
            .select("*")
            .eq("slug", slug)
            .eq("is_active", true)
            .eq("status", "published")
            .single();
          if (error || !data) {
            showNotFound(
              'Post "' + slug + '" was not found or is not published yet.',
            );
            return;
          }
          render(data);
        } catch (e) {
          showNotFound("Failed to load this post. Please try again later.");
          console.error(e);
        }
      }

      /* ════════════════════════════════════════════════════════
     RENDER FULL DETAIL PAGE
  ════════════════════════════════════════════════════════ */
      function render(p) {
        document.title = p.meta_title || p.title + " – Seresafari Africa";
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc)
          metaDesc.setAttribute("content", p.meta_desc || p.excerpt || "");

        const meta = CAT_META[p.category] || CAT_META.general;
        const dateStr = fmtDate(p.published_at || p.created_at);
        const readTime = estimateReadTime(p);
        const tags = (p.tags || "")
          .split(/\s+/)
          .map((t) => t.trim())
          .filter(Boolean);
        const pageUrl = window.location.href.split("?")[0] + "?slug=" + p.slug;

        const tagRowHTML = tags.length
          ? '<div class="tag-row">' +
            tags
              .map(
                (t) =>
                  `<a class="tag-pill" href="../blog.html?search=${encodeURIComponent(t)}"><i class="fa-solid fa-hashtag"></i>${esc(t)}</a>`,
              )
              .join("") +
            "</div>"
          : "";

        const html =
          '<div class="detail-hero" style="margin-top:var(--nav-h);">' +
          '<div class="detail-hero-bg" style="background-image:url(\'' +
          esc(
            p.hero_image ||
              "https://images.unsplash.com/photo-1516426122078-c23e76319801?w=1600&q=85",
          ) +
          "')\"></div>" +
          '<div class="detail-hero-content">' +
          '<div class="detail-badge"><i class="fa-solid ' +
          esc(meta.icon) +
          '"></i> ' +
          esc(meta.label) +
          "</div>" +
          '<h1 class="detail-title">' +
          esc(p.title) +
          "</h1>" +
          '<div class="blog-meta-strip">' +
          '<span class="blog-meta-item"><i class="fa-solid fa-user"></i>' +
          esc(p.author_name || "Seresafari Africa") +
          "</span>" +
          '<span class="blog-meta-item"><i class="fa-regular fa-calendar"></i>' +
          dateStr +
          "</span>" +
          '<span class="blog-meta-item"><i class="fa-regular fa-clock"></i>' +
          readTime +
          " min read</span>" +
          "</div>" +
          "</div>" +
          "</div>" +
          '<div class="detail-layout">' +
          '<div class="detail-main">' +
          '<div class="detail-block">' +
          '<div class="article-body">' +
          (p.content_html || "<p>" + esc(p.excerpt || "") + "</p>") +
          "</div>" +
          tagRowHTML +
          '<div class="share-row">' +
          '<span class="share-label">Share This Post</span>' +
          '<a class="share-btn" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=' +
          encodeURIComponent(pageUrl) +
          '" title="Share on Facebook"><i class="fa-brands fa-facebook-f"></i></a>' +
          '<a class="share-btn" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?url=' +
          encodeURIComponent(pageUrl) +
          "&text=" +
          encodeURIComponent(p.title) +
          '" title="Share on X"><i class="fa-brands fa-x-twitter"></i></a>' +
          '<a class="share-btn" target="_blank" rel="noopener" href="https://wa.me/?text=' +
          encodeURIComponent(p.title + " — " + pageUrl) +
          '" title="Share on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>' +
          '<button type="button" class="share-btn" onclick="copyLink(this,\'' +
          esc(pageUrl).replace(/'/g, "\\'") +
          '\')" title="Copy link"><i class="fa-solid fa-link"></i></button>' +
          "</div>" +
          '<div class="author-box">' +
          '<div class="author-avatar">' +
          initials(p.author_name) +
          "</div>" +
          "<div>" +
          '<div class="author-name-line">Written By</div>' +
          '<div class="author-name">' +
          esc(p.author_name || "Seresafari Africa") +
          "</div>" +
          "</div>" +
          "</div>" +
          "</div>" +
          '<div class="detail-block" id="relatedBlock" style="display:none">' +
          '<div class="detail-block-title"><i class="fa-solid fa-layer-group"></i> More Like This</div>' +
          '<div class="related-grid" id="relatedGrid"></div>' +
          "</div>" +
          "</div>" +

      /* ════════════════════════════════════════════════════════
     COPY LINK
  ════════════════════════════════════════════════════════ */
      function copyLink(btn, url) {
        navigator.clipboard
          .writeText(url)
          .then(() => {
            btn.classList.add("copied");
            const icon = btn.querySelector("i");
            const orig = icon.className;
            icon.className = "fa-solid fa-check";
            setTimeout(() => {
              icon.className = orig;
              btn.classList.remove("copied");
            }, 1800);
          })
          .catch(() => {});
      }

      /* ════════════════════════════════════════════════════════
     SIDEBAR — CATEGORY LIST (from CAT_META, static)
  ════════════════════════════════════════════════════════ */
      function renderSidebarCategories(activeCat) {
        const wrap = document.getElementById("sidebarCatList");
        if (!wrap) return;
        wrap.innerHTML = Object.keys(CAT_META)
          .map((key) => {
            const m = CAT_META[key];
            const active = key === activeCat;
            return `<a class="sidebar-cat-link" style="${active ? "color:var(--gold);font-weight:600" : ""}" href="../blog.html?category=${key}">
          <span><i class="fa-solid ${m.icon}"></i>${esc(m.label)}</span>
          <i class="fa-solid fa-chevron-right" style="font-size:.6rem;color:var(--text)"></i>
        </a>`;
          })
          .join("");
      }

      /* ════════════════════════════════════════════════════════
     SIDEBAR — RECENT POSTS
  ════════════════════════════════════════════════════════ */
      async function loadRecentPosts(currentId) {
        try {
          const { data, error } = await window._sb
            .from("blogs")
            .select("id,title,slug,hero_image,published_at,created_at")
            .eq("is_active", true)
            .eq("status", "published")
            .neq("id", currentId)
            .order("published_at", { ascending: false, nullsFirst: false })
            .limit(4);
          if (error || !data || !data.length) return;

          const box = document.getElementById("recentPostsBox");
          const list = document.getElementById("recentPostsList");
          list.innerHTML = data
            .map(
              (post) => `
        <a class="sidebar-post-item" href="blog-detail.html?slug=${encodeURIComponent(post.slug)}">
          <img class="sidebar-post-img" src="${esc(post.hero_image || "https://images.unsplash.com/photo-1516426122078-c23e76319801?w=200&q=70")}"
            alt="" onerror="this.src='https://images.unsplash.com/photo-1516426122078-c23e76319801?w=200&q=70'"/>
          <div>
            <div class="sidebar-post-title">${esc(post.title)}</div>
            <div class="sidebar-post-date">${fmtDate(post.published_at || post.created_at)}</div>
          </div>
        </a>`,
            )
            .join("");
          box.style.display = "block";

          const footerUl = document.getElementById("footerBlogLinks");
          if (footerUl) {
            footerUl.innerHTML =
              '<li><a href="../blog.html"><i class="fa-solid fa-chevron-right"></i>All Articles</a></li>' +
              data
                .map(
                  (post) =>
                    `<li><a href="blog-detail.html?slug=${encodeURIComponent(post.slug)}"><i class="fa-solid fa-chevron-right"></i>${esc(post.title)}</a></li>`,
                )
                .join("");
          }
        } catch (e) {
          console.warn("Could not load recent posts", e);
        }
      }

      /* ════════════════════════════════════════════════════════
     RELATED POSTS (same category)
  ════════════════════════════════════════════════════════ */
      async function loadRelatedPosts(p) {
        try {
          const { data, error } = await window._sb
            .from("blogs")
            .select("id,title,slug,hero_image,category,published_at,created_at")
            .eq("is_active", true)
            .eq("status", "published")
            .eq("category", p.category || "general")
            .neq("id", p.id)
            .order("published_at", { ascending: false, nullsFirst: false })
            .limit(3);
          if (error || !data || !data.length) return;

          const meta = CAT_META[p.category] || CAT_META.general;
          const grid = document.getElementById("relatedGrid");
          grid.innerHTML = data
            .map(
              (post) => `
        <a class="related-card" href="blog-detail.html?slug=${encodeURIComponent(post.slug)}">
          <div class="related-img">
            <img src="${esc(post.hero_image || "https://images.unsplash.com/photo-1516426122078-c23e76319801?w=400&q=75")}"
              alt="${esc(post.title)}" loading="lazy"
              onerror="this.src='https://images.unsplash.com/photo-1516426122078-c23e76319801?w=400&q=75'"/>
          </div>
          <div class="related-body">
            <div class="related-cat"><i class="fa-solid ${meta.icon}"></i> ${esc(meta.label)}</div>
            <div class="related-title">${esc(post.title)}</div>
          </div>
        </a>`,
            )
            .join("");
          document.getElementById("relatedBlock").style.display = "block";
        } catch (e) {
          console.warn("Could not load related posts", e);
        }
      }
