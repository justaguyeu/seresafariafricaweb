      <div class="skel-layout" id="skeletonBody">

    </div>

    <a
      class="wa-btn"
      href="https://wa.me/255690318461"

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      /* ════════════════════════════════════════════════════════
   DYNAMIC TOUR DETAIL PAGE - FULL FIXED VERSION
════════════════════════════════════════════════════════ */

      /* ── GET SLUG ─────────────────────────────────────────── */
      function getSlug() {
        const params = new URLSearchParams(window.location.search);

        if (params.get("slug")) {
          return params.get("slug");
        }

        const file = window.location.pathname
          .split("/")
          .pop()
          .replace(".html", "");

        return file && file !== "tour-detail" ? file : null;
      }

      /* ── HELPERS ──────────────────────────────────────────── */
      function esc(str = "") {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function capitalize(str = "") {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      /* FIXED JSON PARSER */
      function safeJSON(value, fallback = []) {
        if (!value) return fallback;

        /* Already array/object */
        if (Array.isArray(value)) return value;

        if (typeof value === "object") return value;

        /* String */
        if (typeof value === "string") {
          try {
            const parsed = JSON.parse(value);

            return parsed || fallback;
          } catch (err) {
            console.warn("JSON parse failed:", err);

            return fallback;
          }
        }

        return fallback;
      }

      /* ── LOAD PAGE ────────────────────────────────────────── */
      async function boot() {
        const slug = getSlug();

        if (!slug) {
          showNotFound("No package slug found.");
          return;
        }

        try {
          const { data, error } = await window._sb
            .from("packages")
            .select("*")
            .eq("slug", slug)
            .eq("is_active", true)
            .single();

          if (error || !data) {
            console.error(error);

            showNotFound("Package not found.");

            return;
          }

          console.log("PACKAGE DATA:", data);

          render(data);
        } catch (err) {
          console.error(err);

          showNotFound("Failed to load package.");
        }
      }

      /* ── RENDER PAGE ─────────────────────────────────────── */
      function render(p) {
        document.title = (p.meta_title || p.title) + " – Seresafari Africa";

        const metaDesc = document.querySelector('meta[name="description"]');

        if (metaDesc) {
          metaDesc.setAttribute("content", p.meta_desc || p.short_desc || "");
        }

        /* SAFE PARSE */
        const itinerary = safeJSON(p.itinerary, []);
        const highlights = safeJSON(p.highlights, []);
        const inclusions = safeJSON(p.inclusions, []);
        const exclusions = safeJSON(p.exclusions, []);
        const accommodation = safeJSON(p.accommodation, []);
        const important_notes = safeJSON(p.important_notes, []);
        const add_ons = safeJSON(p.add_ons, []);
        const price_tiers = safeJSON(p.price_tiers, []);

        console.log("ITINERARY:", itinerary);

        const html = `

  <!-- HERO -->
  <div class="detail-hero" style="margin-top:var(--nav-h);">

    <div class="detail-hero-bg"
      style="background-image:url('${esc(p.detail_hero_img || p.hero_image)}')">
    </div>

    <div class="detail-hero-content">

      <div class="detail-badge">
        <i class="fa-solid ${esc(p.badge_icon || "fa-star")}"></i>

        ${esc(p.badge_text || "Popular")}
      </div>

      <h1 class="detail-title">
        ${esc(p.title)}
      </h1>

      <div class="detail-meta-strip">

        <div class="detail-meta-item">
          <i class="fa-regular fa-calendar"></i>
          <strong>${esc(p.duration_label || "")}</strong>
        </div>

        <div class="detail-meta-item">
          <i class="fa-solid fa-users"></i>
          <strong>${esc(p.group_size || "")}</strong>
        </div>

      </div>

    </div>
  </div>

  <!-- CONTENT -->
  <div class="detail-layout">

    <div class="detail-main">

      <!-- OVERVIEW -->
      <div class="detail-block">

        <div class="detail-block-title">
          <i class="fa-solid fa-circle-info"></i>
          Tour Overview
        </div>

        <p>
          ${esc(p.short_desc || "")}
        </p>

      </div>

      <!-- HIGHLIGHTS -->
      ${
        highlights.length
          ? `
      <div class="detail-block">

        <div class="detail-block-title">
          <i class="fa-solid fa-star"></i>
          Tour Highlights
        </div>

        <div class="itin-activities">

          ${highlights
            .map(
              (h) => `
            <span class="itin-tag">
              <i class="fa-solid fa-check"></i>
              ${esc(h)}
            </span>
          `,
            )
            .join("")}

        </div>

      </div>
      `
          : ""
      }

      <!-- ITINERARY -->
      ${
        itinerary.length
          ? `
      <div class="detail-block">

        <div class="detail-block-title">
          <i class="fa-solid fa-map-location-dot"></i>
          Day By Day Itinerary
        </div>

        <div class="itinerary">

          ${itinerary.map((day) => buildDayHTML(day)).join("")}

        </div>

      </div>
      `
          : `
      <div class="detail-block">

        <div class="detail-block-title">
          <i class="fa-solid fa-map-location-dot"></i>
          Day By Day Itinerary
        </div>

        <p style="color:red">
          No itinerary data found.
        </p>

      </div>
      `
      }

      <!-- INCLUSIONS -->
      ${
        inclusions.length || exclusions.length
          ? `
      <div class="detail-block">

        <div class="detail-block-title">
          <i class="fa-solid fa-list-check"></i>
          Included / Excluded
        </div>

        <div class="inc-exc-grid">

          <div class="inc-exc-box included">

            <h4>Included</h4>

            <ul class="inc-exc-list">

              ${inclusions
                .map(
                  (item) => `
                <li>${esc(item)}</li>
              `,
                )
                .join("")}

            </ul>

          </div>

          <div class="inc-exc-box excluded">

            <h4>Excluded</h4>

            <ul class="inc-exc-list">

              ${exclusions
                .map(
                  (item) => `
                <li>${esc(item)}</li>
              `,
                )
                .join("")}

            </ul>

          </div>

        </div>

      </div>
      `
          : ""
      }

    </div>

    <!-- SIDEBAR -->
    <div class="detail-sidebar">

      <div class="price-box">

        <div class="price-box-title">
          <i class="fa-solid fa-tag"></i>
          Price
        </div>

        <div style="
          font-size:2rem;
          font-weight:700;
          color:var(--gold);
          margin-bottom:10px;
        ">
          ${esc(p.price_display || "")}
        </div>

        <a href="../contact.html"
          class="btn btn-primary"
          style="width:100%">
          Enquire Now
        </a>

      </div>

    </div>

  </div>
  `;

        document.getElementById("pageContent").innerHTML = html;
      }

      /* ── BUILD DAY HTML ───────────────────────────────────── */
      function buildDayHTML(day) {
        if (!day || typeof day !== "object") {
          return "";
        }

        /* FLEXIBLE FIELD SUPPORT */
        const dayNumber = day.day || day.day_number || "";

        const title = day.title || day.heading || "";

        const description = day.description || day.desc || "";

        const route = day.route || "";

        const accommodation = day.accommodation || day.hotel || "";

        const mealPlan = day.meal_plan || "";

        const activities = Array.isArray(day.activities) ? day.activities : [];

        return `

  <div class="itin-day">

    <div class="itin-num">

      <div class="day-label">
        Day
      </div>

      <div class="day-number">
        ${esc(dayNumber)}
      </div>

    </div>

    <div class="itin-body">

      <div class="itin-title">
        ${esc(title)}
      </div>

      ${
        route
          ? `
      <div class="itin-route">
        <i class="fa-solid fa-route"></i>
        ${esc(route)}
      </div>
      `
          : ""
      }

      <p class="itin-desc">
        ${esc(description)}
      </p>

      ${
        activities.length
          ? `
      <div class="itin-activities">

        ${activities
          .map(
            (act) => `
          <span class="itin-tag">
            ${esc(act)}
          </span>
        `,
          )
          .join("")}

      </div>
      `
          : ""
      }

      ${
        accommodation
          ? `
      <div class="itin-sleep">

        <i class="fa-solid fa-bed"></i>

        ${esc(accommodation)}

        ${
          mealPlan
            ? `
        | ${esc(mealPlan)}
        `
            : ""
        }

      </div>
      `
          : ""
      }

    </div>

  </div>
  `;
      }

      /* ── NOT FOUND ────────────────────────────────────────── */
      function showNotFound(msg) {
        document.getElementById("pageContent").innerHTML = `

    <div class="not-found">

      <i class="fa-solid fa-binoculars"></i>

      <h2>Package Not Found</h2>

      <p>${esc(msg)}</p>

      <a href="../tours.html"
        class="btn btn-primary">
        Back To Tours
      </a>

    </div>
  `;
      }

      /* ── START ────────────────────────────────────────────── */
      boot();
    </script>
  </body>
